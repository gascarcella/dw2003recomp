# decomp-permuter import settings. Usage:
#   tools/venv/bin/python tools/ext/decomp-permuter/import.py src/main/X.c asm/main/nonmatchings/X/func.s
#   tools/venv/bin/python tools/ext/decomp-permuter/permuter.py nonmatchings/func
# compiler_command must match the file's compiler in configure.py (default 2.8.1, -G0).
compiler_type = "gcc"
compiler_command = "tools/cc_psx.sh -V 2.8.1 -G 0 -Iinclude -Iinclude/asm_generated -I."
assembler_command = "tools/binutils/bin/mipsel-linux-gnu-as -EL -march=r3000 -mtune=r3000 -no-pad-sections -G0 -I. -Iinclude/asm_generated"
asm_prelude_file = "tools/permuter_prelude.inc"
objdump_command = "tools/binutils/bin/mipsel-linux-gnu-objdump -drz -m mips:3000"
