# splat config for the tier-1 overlay AAA/PRO/STAGSLCT.PRO (docs/DISC_LAYOUT.md "Overlays"): raw code and
# data with no header, loaded at 0x80082CB0. It links against the EXE's symbols: splat gets the EXE's
# names (build/exe_symbols.txt), the linker the EXE ELF's symbol table (configure.py, EXE_SYMS).
# Layout as psylink writes it: .rodata, .text, .data, then .bss as zeros (part of the file, like the EXE).
name: STAGSLCT.PRO
sha1: 535f40ad6a545f2867646ad925481c42a11c3ad7
options:
  basename: STAGSLCT.PRO
  base_path: ..
  target_path: extracted/disc/AAA/PRO/STAGSLCT.PRO
  elf_path: build/stagslct/STAGSLCT.PRO.elf
  platform: psx
  compiler: GCC

  build_path: build/stagslct
  asm_path: asm/stagslct
  src_path: src/stagslct
  asset_path: assets/stagslct
  ld_script_path: build/stagslct/STAGSLCT.PRO.ld
  symbol_addrs_path:
    - build/exe_symbols.txt   # the EXE's names (configure.py writes it from config/symbol_addrs.txt)
    - config/stagslct.symbols.txt
  create_undefined_funcs_auto: True
  undefined_funcs_auto_path: build/stagslct/undefined_funcs_auto.txt
  create_undefined_syms_auto: True
  undefined_syms_auto_path: build/stagslct/undefined_syms_auto.txt

  gp_value: 0x8005CB50
  section_order: [".rodata", ".text", ".data", ".bss"]
  ld_bss_is_noload: False  # .bss is in the file as zeros
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  make_full_disasm_for_code: True
  generate_asm_macros_files: True
  generated_asm_macros_directory: include/asm_generated

segments:
  - name: stagslct
    type: code
    start: 0x0
    vram: 0x80082CB0
    # Unnamed symbols are func_STAGSLCT_<addr>, D_STAGSLCT_<addr> (overlays share addresses; DECISIONS naming).
    symbol_name_format: STAGSLCT_$VRAM
    subsegments:
      # One file (docs/DECISIONS.md "Overlay file split"): no jump tables, .rodata in code order (first the
      # strings of the .data tables, then 849A4 and 849C8 of the last big function), .data referenced in code
      # order (85ED0..871A8), no duplicated helpers.
      - [0x0,    .rodata, stagslct_800849CC]
      - [0x1D1C, c, stagslct_800849CC]   # 0x800849CC .text (tools/overlay_layout.py)
      # .data, then .bss (zeros in the file), each per file in link order (tools/data_owners.py -t stagslct;
      # DECISIONS "Overlay .data/.bss per file"). .bss: the zero buffer at the end (the BIOS version text the
      # code writes before use); it could be zero-initialised .data (weak).
      - [0x3220, .data, stagslct_800849CC]   # 0x80085ED0 (after the last function's jr ra)
      - [0x44E4, .bss, stagslct_800849CC]   # 0x80087194
  - [0x44FC]
