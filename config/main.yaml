# splat config for the boot executable SLES_039.36 (Digimon World 2003, Europe).
# Memory map: docs/DISC_LAYOUT.md. Library boundaries: tools/psyq_match.py (Psy-Q 4.7).
# Run through configure.py (it splits, then writes build.ninja), or by hand:
#   tools/venv/bin/splat split config/main.yaml
#
# Overlays get their own config/<name>.yaml with the same layout of paths
# (asm/<name>/, src/<name>/, build/<name>/) and link against this EXE's symbols.
name: SLES_039.36
sha1: d1b7e4d646e3a9c2b88fdb25d20b5f7116bbb06d
options:
  basename: SLES_039.36
  base_path: ..
  target_path: extracted/disc/SLES_039.36
  elf_path: build/main/SLES_039.36.elf
  platform: psx
  compiler: GCC

  build_path: build/main
  asm_path: asm/main
  src_path: src/main
  asset_path: assets/main
  ld_script_path: build/main/SLES_039.36.ld
  symbol_addrs_path:
    - config/symbol_addrs.txt
  create_undefined_funcs_auto: True
  undefined_funcs_auto_path: build/main/undefined_funcs_auto.txt
  create_undefined_syms_auto: True
  undefined_syms_auto_path: build/main/undefined_syms_auto.txt

  # crt0 sets $gp to 0x8005CB50 (small data around the end of .data / start of .bss).
  gp_value: 0x8005CB50
  # psylink puts each object's .rodata before all .text.
  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]
  # The file holds .bss as zeros (the header has no bss fields), so .bss is part of the
  # loaded image; this also keeps the ROM position of the tail right.
  ld_bss_is_noload: False
  # psylink packs objects at 4-byte alignment; GNU as would give every section 16.
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  # Also write a full .s for each c segment: assembled, it is objdiff's "target" object.
  make_full_disasm_for_code: True
  generate_asm_macros_files: True
  generated_asm_macros_directory: include/asm_generated

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    bss_size: 0x25FC8          # 0x8005CCE8-0x80082CB0, cleared by crt0
    subsegments:
      # File boundaries: DECISIONS "File boundaries come from evidence". psylink puts every object's
      # .rodata (in link order) before all .text, so .rodata is split per file too.
      - [0x800, .rodata, inn]             # 0x80010000
      - [0x884, .rodata, fieldmenu]       # 0x80010084
      - [0x8C4, .rodata, main]            # 0x800100C4 heap base, title TIM pointers
      - [0x8CC, .rodata, memcard]         # 0x800100CC save file names per region
      - [0x960, .rodata, gamestate]       # 0x80010160
      - [0x988, .rodata, pad]             # 0x80010188
      - [0x9A4, .rodata, message]         # 0x800101A4 SJIS debug messages
      - [0xAA4, .rodata, font]            # 0x800102A4 font_get_text_width's jump table
      # Psy-Q 4.7 library objects with .rodata, in link order (owners: who references it).
      - [0xAB8, rodata, psyq/libpad/pdent4]
      - [0xAD8, rodata, psyq/libgpu/sys]
      - [0xCF8, rodata, psyq/libc2/prnt]
      - [0xF18, rodata, psyq/libgs/gs_108]
      - [0xF38, rodata, psyq/libgs/gs_123]
      - [0xFC8, rodata, psyq/libcd/event]
      - [0xFE8, rodata, psyq/libcd/c_011]
      - [0x1008, rodata, psyq/libcd/bios_1]  # its debug name tables (in .data) point at 0x80010808+
      - [0x1268, rodata, psyq/libc2/puts]
      - [0x1278, rodata, psyq/libetc/vsync]
      - [0x12BC, rodata, psyq/libetc/intr]
      - [0x12F8, rodata, psyq/libetc/intr_dma]
      - [0x1328, rodata, psyq/libsnd/ssopenp]
      - [0x1358, rodata, psyq/libsnd/sepinit]
      - [0x1378, rodata, psyq/libsnd/sstick]
      - [0x1398, rodata, psyq/libspu/spu]
      - [0x13E8, rodata, psyq/libspu/s_sva]
      - [0x1428, rodata, psyq/libspu/s_sca]
      - [0x1468, rodata, psyq/libmcrd/libmcrd]
      - [0x1638, rodata, psyq/libmcrd/userfunc]
      - [0x1658, rodata, psyq/libmcrd/low]
      - [0x1668, rodata, psyq/libmcrd/unformat]
      - [0x1688, asm, crt0]            # 0x80010E88 Psy-Q 2MBYTE.OBJ: __main, __SN_ENTRY_POINT
      # Game code, one C file per unit (INCLUDE_ASM for what isn't decompiled yet). Units named
      # game_<addr> are files whose purpose isn't understood yet.
      - [0x174C, c, inn]               # 0x80010F4C the inn (pay, heal the party)
      - [0x28B4, c, fieldmenu]         # 0x800120B4 the field menu; starts with the same static window helpers as inn
      - [0x3CAC, c, records]           # 0x800134AC ID records and item lists (-G8: owns .sdata)
      - [0x3E94, c, cdload]            # 0x80013694 CD reads and file loading (-G8)
      - [0x49E4, c, filetable]         # 0x800141E4 accessors for the file LBA table
      - [0x4A74, c, object]            # 0x80014274 object system: counters; object_new creates objects
      - [0x4D24, c, main]              # 0x80014524 main (-G8)
      - [0x5054, c, memcard]           # 0x80014854 memory card; memcard_funcs is its function table (-G8: "*" in .sdata)
      - [0x5D90, c, gamestate]         # 0x80015590 game state (gamestate_data: flags, items, Digimon, party) and condition checks
      - [0x8370, c, heap]              # 0x80017B70 heap allocator; from 0x80017FB4 the object list (heap_objects)
      - [0x8B10, c, pad]               # 0x80018310 controllers (libpad)
      - [0x9B70, c, message]           # 0x80019370 text/message system (-G8: SJIS literals in .sdata)
      - [0xDBF4, c, gfx]               # 0x8001D3F4 graphics: display, packet buffers, layers; $gp gfx_frame_pending, gfx_initialized
      - [0xEFE0, c, card]              # 0x8001E7E0 the card-picture object (card_init sets one up); $gp card_module
      - [0xF4B0, c, sprite]            # 0x8001ECB0 sprite banks: sprite_draw; $gp sprite_current
      - [0xFF38, c, font]              # 0x8001F738 text width, glyph <-> Shift-JIS; $gp font_module
      - [0x1051C, c, tim]              # 0x8001FD1C TIM loading; $gp tim_module
      - [0x10830, c, sound]            # 0x80020030 sound (libsnd)
      - [0x11358, c, overlay]          # 0x80020B58 loads and runs the stage overlays (table overlay_entries); own data, not sound's
      # Psy-Q 4.7 libraries from 0x80020D8C, one unit per library object (tools/psyq_match.py;
      # the ambiguous ones as settled in docs/TOOLCHAIN.md "Ambiguous objects"). Each object's
      # .text is padded to 16 bytes, which is where the next one starts.
      - [0x1158C, asm, psyq/libpad/pdcmd1]
      - [0x115CC, asm, psyq/libpad/pdcmd2]
      - [0x1173C, asm, psyq/libpad/pdcmd3]
