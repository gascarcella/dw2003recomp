      - [0x4D4E0, .sdata, gfx]                # 0x8005CCE0 $gp
      # .sbss (game only): one 8-aligned slot per object, each used through $gp by its own file only.
      - [0x4D4E8, sbss, crt0]                 # 0x8005CCE8 crt0 saves $ra here around InitHeap
      - [0x4D4F0, .sbss, records]             # 0x8005CCF0 menu choice (fieldmenu, STSTATUS use it without $gp: not theirs)
