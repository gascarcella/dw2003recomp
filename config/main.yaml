      # .data/.sdata/.sbss/.bss per file, in link order (DECISIONS "Data in C, split per object"; evidence per symbol: tools/data_owners.py). Game objects' .data is
      # packed at 4; their .sdata/.sbss/.bss start 8-aligned (configure.py align_small_data).
      - [0x2F5CC, .data, inn]                 # 0x8003EDCC inn_table
      - [0x2F67C, .data, fieldmenu]           # 0x8003EE7C
      - [0x2F75C, .data, records]             # 0x8003EF5C ID records; module struct records_state
      - [0x35304, .data, cdload]              # 0x80044B04 module structs cdload_reader, cdload_module
      - [0x3576C, .data, filetable]           # 0x80044F6C filetable_lba, _sectors, _funcs
      - [0x38F50, .data, memcard]             # 0x80048750 state; table memcard_funcs
      - [0x392BC, .data, gamestate]           # 0x80048ABC table gamestate_flags; gamestate_data
      - [0x3BDDC, .data, heap]                # 0x8004B5DC heap_funcs; object list heap_objects
      - [0x3BFD0, .data, pad]                 # 0x8004B7D0 pad_state, button map; random module pad_random_table, pad_random
      # 0x8004DC10-0x8004DCA0: 16 zero bytes, an identity MATRIX (FIGHTSTG reads it) and 3 scale
      # matrices, which no EXE code uses (only FIGHTSTG reads the identity; nothing reads the rest): the
      # end of pad's or the start of message's data, or a data-only file. Defined in message.c (C initializers).
      - [0x3E410, .data, message]             # 0x8004DC10 message_zero_vector .., message_control_handlers ... message_module
      - [0x3E610, .data, gfx]                 # 0x8004DE10 module struct gfx_module
      - [0x3E7B8, .data, card]                # 0x8004DFB8
      # sprite has no .data. font's own tables, then glyph tables only message's message_fonts points
      # at (0x8004E5A4-0x80051208): font's (or tim's; neither references them).
      - [0x3E810, .data, font]                # 0x8004E010
      - [0x41A08, .data, sound]               # 0x80051208 records that sound's sound_banks points at; sound_module
      - [0x46470, .data, overlay]             # 0x80055C70
      # Psy-Q objects' .data starts 8-aligned. Owners: the object whose code references it, in
      # link order; "conflict" = referenced only by another object (often a library global).
      - [0x46538, data, psyq/libpad/pdmaiini]  # 0x80055D38
      - [0x46548, data, psyq/libpad/pddirres]  # 0x80055D48
      - [0x46558, data, psyq/libpad/pdtapres]  # 0x80055D58 libpad globals used by every pd* object
      - [0x46598, data, psyq/libpad/pdresres]  # 0x80055D98
      - [0x46618, data, psyq/libc2/ctype_2]    # 0x80055E18 _ctype_ (code reads _ctype_ + 1)
      - [0x466B0, data, psyq/libgpu/sys]       # 0x80055EB0
      - [0x46848, data, psyq/libc2/putchar]    # 0x80056048
      - [0x46858, data, psyq/libgpu/break]     # 0x80056058
      - [0x46888, data, psyq/libgte/geo_00]    # 0x80056088 sine table
