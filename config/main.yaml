      # .sdata (game only, from _gp). 0x8005CB50 (the heap start, read by heap) goes with
      # records' 83 words, the items' 4-byte data (an object starts 8-aligned; theirs at 0x8005CB54).
      # The language records_language and the 60 Hz flag records_60hz are not main's: main reads CCAC with
      # %hi/%lo but its own .sdata variables after it (main_boot_rect, main_object) through $gp. So they
      # end records' (or an object of their own between it and main: cdload/filetable/object).
      - [0x4D350, .sdata, records]            # 0x8005CB50
      # main: main_screen_pos (NTSC screen position; main's .sdata starts 8-aligned before main_boot_rect),
      # the boot screen RECT main_boot_rect and main_object.
      - [0x4D4B0, .sdata, main]               # 0x8005CCB0
      - [0x4D4C0, .sdata, memcard]            # 0x8005CCC0 the "*" literal, then two unreferenced globals
