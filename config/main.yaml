  # In the file but not part of the program image proper: zeros over .bss and the
  # tier-1 overlay slot/heap, then a 320x480 TIM that tier-2 overlays later overwrite.
  - name: tail
    type: code
    start: 0x734B0
    vram: 0x80082CB0
    subsegments:
      - [0x734B0, bin, heap_zero]        # 0x80082CB0-0x800A5DE0
      - [0x965E0, bin, title_tim]        # 0x800A5DE0 TIM (8-byte header + pixels)
      - [0xE15F4, bin, tail_pad]         # 0x800F0DF4 zero padding to the sector

