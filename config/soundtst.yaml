# splat config for the tier-1 overlay AAA/PRO/SOUNDTST.PRO (docs/DISC_LAYOUT.md "Overlays"): raw code and
# data with no header, loaded at 0x80082CB0. It links against the EXE's symbols: splat gets the EXE's
# names (build/exe_symbols.txt), the linker the EXE ELF's symbol table (configure.py, EXE_SYMS).
# Layout as psylink writes it: .rodata, .text, .data, then .bss as zeros (part of the file, like the EXE).
name: SOUNDTST.PRO
sha1: c755a4a080b086bcc8c6020c46034fd17d7cbebc
options:
  basename: SOUNDTST.PRO
  base_path: ..
  target_path: extracted/disc/AAA/PRO/SOUNDTST.PRO
  elf_path: build/soundtst/SOUNDTST.PRO.elf
  platform: psx
  compiler: GCC

  build_path: build/soundtst
  asm_path: asm/soundtst
  src_path: src/soundtst
  asset_path: assets/soundtst
  ld_script_path: build/soundtst/SOUNDTST.PRO.ld
  symbol_addrs_path:
    - build/exe_symbols.txt   # the EXE's names (configure.py writes it from config/symbol_addrs.txt)
    - config/soundtst.symbols.txt
  create_undefined_funcs_auto: True
  undefined_funcs_auto_path: build/soundtst/undefined_funcs_auto.txt
  create_undefined_syms_auto: True
  undefined_syms_auto_path: build/soundtst/undefined_syms_auto.txt

  gp_value: 0x8005CB50
  section_order: [".rodata", ".text", ".data", ".bss"]
  subalign: 4
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  use_legacy_include_asm: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  make_full_disasm_for_code: True
  generate_asm_macros_files: True
  generated_asm_macros_directory: include/asm_generated

segments:
  - name: soundtst
    type: code
    start: 0x0
    vram: 0x80082CB0
    # Unnamed symbols are func_SOUNDTST_<addr>, D_SOUNDTST_<addr> (overlays share addresses; DECISIONS naming).
    symbol_name_format: SOUNDTST_$VRAM
    subsegments:
      # One file (DECISIONS "File boundaries come from evidence"): no jump tables, .rodata in code order (first the
      # strings of the .data tables at 84D74.., then 8432C, 8435C, 8436C in the order of their functions), .data
      # referenced in code order (856E4..85A40), no duplicated helpers.
      - [0x0,    .rodata, soundtst_80084370]
      - [0x16C0, c, soundtst_80084370]   # 0x80084370 .text (tools/overlay_layout.py)
      # .data, then .bss (zeros in the file), each per file in link order (tools/data_owners.py -t soundtst;
      # DECISIONS "Data in C, split per object").
      - [0x20C4, .data, soundtst_80084370]   # 0x80084D74 (after the last function's jr ra); no .bss
  - [0x2D98]
